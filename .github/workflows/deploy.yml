name: 自动部署

on:
  push:
    branches: [ main ]

# 定义项目配置（新项目只需修改这里）
env:
  PROJECT_NAME: wuxia-game
  BACKEND_PORT: 8080

jobs:
  deploy:
    runs-on: self-hosted
    steps:
    - name: 拉取最新代码（手动clone彻底解决checkout错误）
      shell: powershell
      run: |
        # 第一步：强制删除当前目录下所有可见文件
        Remove-Item -Path .\* -Recurse -Force -ErrorAction SilentlyContinue
        # 第二步：强制删除所有隐藏/系统文件（避免.git目录残留）
        Get-ChildItem -Hidden -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
        # 等1秒保证文件系统操作完成（Windows文件系统延迟问题）
        Start-Sleep -Seconds 1
        # 克隆最新的main分支代码
        git clone --depth 1 --branch main https://github.com/paninix/wuxia-game.git .
    
    - name: 部署后端
      shell: powershell
      run: |
        # 解决PowerShell中文乱码问题
        chcp 65001 | Out-Null
        $OutputEncoding = [System.Text.Encoding]::UTF8
        
        # 在 runner 临时目录构建
        cd backend
        npm install
        npm run build
        
        # 检查build是否成功（关键！避免空dist部署）
        if (-not (Test-Path dist/index.js)) {
          Write-Error "❌ 后端build失败，dist/index.js不存在，请检查ts配置"
          exit 1
        }
        Write-Host "✅ 后端build成功，dist目录大小: $((Get-ChildItem dist -Recurse | Measure-Object Length -Sum).Sum / 1MB) MB"
        
        # 部署到统一目录
        $targetDir = "D:/Development/okii-deploy/okii-back/$env:PROJECT_NAME"
        New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
        Remove-Item -Recurse -Force "$targetDir/*" -ErrorAction SilentlyContinue
        
        # ✅ 修复dist嵌套问题：复制dist目录下的所有内容，而不是dist文件夹本身
        Copy-Item -Recurse -Force dist/* "$targetDir/"
        Copy-Item -Force package.json "$targetDir/package.json"
        Copy-Item -Force .env "$targetDir/.env" -ErrorAction SilentlyContinue
        
        # 检查复制后的文件是否存在
        if (-not (Test-Path "$targetDir/index.js")) {
          Write-Error "❌ 部署失败，目标目录缺少index.js"
          Get-ChildItem $targetDir -Recurse | Write-Host
          exit 1
        }
        
        # 到统一目录安装生产依赖
        cd $targetDir
        npm install --omit=dev --no-fund --no-audit
        
        # 先同步PM2版本，避免版本不匹配
        pm2 update | Out-Null
        
        # 启动服务
        pm2 stop $env:PROJECT_NAME -ErrorAction SilentlyContinue
        pm2 delete $env:PROJECT_NAME -ErrorAction SilentlyContinue
        pm2 start index.js --name $env:PROJECT_NAME
        
        # 验证服务是否启动成功
        Start-Sleep -Seconds 2
        if ((pm2 id $env:PROJECT_NAME) -match '\d+') {
          Write-Host "✅ 后端服务启动成功，端口: $env:BACKEND_PORT"
        } else {
          Write-Error "❌ 后端服务启动失败，请查看PM2日志"
          pm2 logs $env:PROJECT_NAME --lines 20
          exit 1
        }
    
    - name: 部署前端
      run: |
        # 在 runner 临时目录构建
        cd frontend
        npm install
        npm run build
        
        # 部署到统一目录
        $targetDir = "D:/Development/okii-deploy/okii-front/$env:PROJECT_NAME"
        New-Item -ItemType Directory -Force -Path $targetDir
        Remove-Item -Recurse -Force "$targetDir/dist" -ErrorAction SilentlyContinue
        Copy-Item -Recurse -Force dist "$targetDir"
