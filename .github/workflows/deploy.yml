name: 自动部署

on:
  push:
    branches: [ main ]

# 定义项目配置（新项目只需修改这里）
env:
  PROJECT_NAME: wuxia-game
  BACKEND_PORT: 3000

jobs:
  deploy:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
    
    - name: 部署后端
      run: |
        # 在 runner 临时目录构建
        cd backend
        npm install
        npm run build
        
        # 部署到统一目录
        $targetDir = "D:/Development/okii-deploy/okii-back/$env:PROJECT_NAME"
        New-Item -ItemType Directory -Force -Path $targetDir
        Remove-Item -Recurse -Force "$targetDir/dist" -ErrorAction SilentlyContinue
        Copy-Item -Recurse -Force dist "$targetDir/dist"
        Copy-Item -Force package.json "$targetDir/package.json"
        
        # 到统一目录重启 PM2
        cd $targetDir
        npm install
        node node_modules/pm2/bin/pm2 restart $env:PROJECT_NAME
        if ($LASTEXITCODE -ne 0) {
          node node_modules/pm2/bin/pm2 start dist/index.js --name $env:PROJECT_NAME
        }
    
    - name: 部署前端
      run: |
        # 在 runner 临时目录构建
        cd frontend
        npm install
        npm run build
        
        # 部署到统一目录
        $targetDir = "D:/Development/okii-deploy/okii-front/$env:PROJECT_NAME"
        New-Item -ItemType Directory -Force -Path $targetDir
        Remove-Item -Recurse -Force "$targetDir/dist" -ErrorAction SilentlyContinue
        Copy-Item -Recurse -Force dist "$targetDir/dist"
