name: 自动部署

on:
  push:
    branches: [ main ]

# 定义项目配置（新项目只需修改这里）
env:
  PROJECT_NAME: wuxia-game
  BACKEND_PORT: 8080

jobs:
  deploy:
    runs-on: self-hosted
    steps:
    - name: 拉取最新代码（手动clone彻底解决checkout错误）
      shell: powershell
      run: |
        # 彻底清空工作目录（先删除再重建，100%空）
        $currentDir = Get-Location
        cd ..
        Remove-Item -Recurse -Force $currentDir -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Path $currentDir | Out-Null
        cd $currentDir
        # 克隆最新的main分支代码
        git clone --depth 1 --branch main https://github.com/paninix/wuxia-game.git .
    
    - name: 部署后端
      run: |
        # 在 runner 临时目录构建
        cd backend
        npm install
        npm run build
        
        # 部署到统一目录
        $targetDir = "D:/Development/okii-deploy/okii-back/$env:PROJECT_NAME"
        New-Item -ItemType Directory -Force -Path $targetDir
        Remove-Item -Recurse -Force "$targetDir/dist" -ErrorAction SilentlyContinue
        Copy-Item -Recurse -Force dist "$targetDir/dist"
        Copy-Item -Force package.json "$targetDir/package.json"
        
        # 到统一目录重启 PM2
        cd $targetDir
        npm install
        node node_modules/pm2/bin/pm2 restart $env:PROJECT_NAME
        if ($LASTEXITCODE -ne 0) {
          node node_modules/pm2/bin/pm2 start dist/index.js --name $env:PROJECT_NAME
        }
    
    - name: 部署前端
      run: |
        # 在 runner 临时目录构建
        cd frontend
        npm install
        npm run build
        
        # 部署到统一目录
        $targetDir = "D:/Development/okii-deploy/okii-front/$env:PROJECT_NAME"
        New-Item -ItemType Directory -Force -Path $targetDir
        Remove-Item -Recurse -Force "$targetDir/dist" -ErrorAction SilentlyContinue
        Copy-Item -Recurse -Force dist "$targetDir"
