name: 自动部署

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
    
    - name: 部署后端
      run: |
        # 在 runner 临时目录构建
        cd backend
        npm install
        npm run build
        
        # 删除原来的 dist，然后复制新的
        Remove-Item -Recurse -Force "C:/Users/Administrator/Desktop/Code/backend/dist" -ErrorAction SilentlyContinue
        Copy-Item -Recurse -Force dist "C:/Users/Administrator/Desktop/Code/backend/dist"
        Copy-Item -Force package.json "C:/Users/Administrator/Desktop/Code/backend/package.json"
        
        # 到实际项目目录重启 PM2
        cd "C:/Users/Administrator/Desktop/Code/backend"
        npm install
        node node_modules/pm2/bin/pm2 restart wuxia-game-backend
        if ($LASTEXITCODE -ne 0) {
          node node_modules/pm2/bin/pm2 start dist/index.js --name wuxia-game-backend
        }
    
    - name: 部署前端
      run: |
        # 在 runner 临时目录构建
        cd frontend
        npm install
        npm run build
        
        # 删除原来的 dist，然后复制新的
        Remove-Item -Recurse -Force "C:/Users/Administrator/Desktop/Code/frontend/dist" -ErrorAction SilentlyContinue
        Copy-Item -Recurse -Force dist "C:/Users/Administrator/Desktop/Code/frontend/dist"
