name: 自动部署
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
    - name: 拉取最新代码
      shell: powershell
      run: |
        Remove-Item -Path .\* -Recurse -Force -ErrorAction SilentlyContinue
        Get-ChildItem -Hidden -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
        Start-Sleep -Seconds 1
        git clone --depth 1 --branch main https://github.com/paninix/wuxia-game.git .

    - name: 一键构建更新所有服务
      shell: powershell
      run: |
        # 构建并启动所有服务，自动删除旧容器
        docker-compose up -d --build --remove-orphans
        
        # 等待服务启动完成
        Start-Sleep -Seconds 10
        
        # 验证服务是否正常
        try {
          $response = Invoke-WebRequest -Uri "http://localhost/api/health" -TimeoutSec 10
          if ($response.StatusCode -eq 200) {
            Write-Host "🎉 全站部署成功！"
            Write-Host "👉 游戏访问地址：http://localhost"
            Write-Host "👉 后端接口地址：http://localhost/api"
          } else {
            throw "健康检查失败，状态码：$($response.StatusCode)"
          }
        } catch {
          Write-Error "❌ 部署失败，正在打印日志排查..."
          docker-compose logs --tail 100
          exit 1
        }
